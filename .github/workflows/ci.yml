name: CI

on:
  pull_request:
    branches:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
jobs:
  check-if-affected:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 20

      - name: Check if affected
        id: affected
        run: |
          EXIT_CODE=0

          # Get the last commit SHA of the target branch
          TARGET_BRANCH_SHA=$(git rev-parse origin/${GITHUB_BASE_REF})

          npx turbo-ignore @poker-planning/frontend --fallback=$TARGET_BRANCH_SHA --task=test || EXIT_CODE=$?
          if [ $EXIT_CODE -eq 1 ]; then
            echo "isFrontendAffected=true" >> $GITHUB_OUTPUT
          else
            echo "isFrontendAffected=false" >> $GITHUB_OUTPUT
          fi

          npx turbo-ignore @poker-planning/backend --fallback=$TARGET_BRANCH_SHA --task=test || EXIT_CODE=$?
          if [ $EXIT_CODE -eq 1 ]; then
            echo "isBackendAffected=true" >> $GITHUB_OUTPUT
          else
            echo "isBackendAffected=false" >> $GITHUB_OUTPUT
          fi

    outputs:
      isFrontendAffected: ${{ steps.affected.outputs.isFrontendAffected }}
      isBackendAffected: ${{ steps.affected.outputs.isBackendAffected }}

  frontend-unit-tests:
    needs: check-if-affected
    if: ${{ needs.check-if-affected.outputs.isFrontendAffected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        # we don't specify the version since the action takes it from packageManager in the root package.json

      - name: Setup Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run the tests
        run: pnpm test --filter=@poker-planning/frontend

  frontend-linting:
    needs: check-if-affected
    if: ${{ needs.check-if-affected.outputs.isFrontendAffected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build the frontend
        run: pnpm build --filter=@poker-planning/frontend

      - name: Run the frontend architecture dependency linting
        working-directory: apps/frontend
        run: pnpm lint:deps

      - name: Run the linting
        run: pnpm lint --filter=@poker-planning/frontend

      - name: Run the type-checking
        run: pnpm type-check --filter=@poker-planning/frontend

  frontend-interaction-and-accessibility-tests:
    needs: check-if-affected
    if: ${{ needs.check-if-affected.outputs.isFrontendAffected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright
        working-directory: apps/frontend
        run: pnpm exec playwright install --with-deps

      - name: Build Storybook
        working-directory: apps/frontend
        run: pnpm run build-storybook --quiet

      - name: Serve Storybook and run tests
        working-directory: apps/frontend
        run: |
          pnpm dlx concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
            "pnpm dlx http-server storybook-static --port 6006 --silent" \
            "pnpm dlx wait-on tcp:6006 && pnpm run test-storybook"

  backend-tests:
    needs: check-if-affected
    if: ${{ needs.check-if-affected.outputs.isBackendAffected == 'true' }}
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2

      - name: Setup dotnet
        uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
        with:
          dotnet-version: "9.0.x"

      - name: Set environment variables
        run: |
          echo "JWTSETTINGS__SECRET=${{ secrets.JWTSETTINGS__SECRET }}" >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: apps/backend
        run: dotnet restore

      - name: Build
        working-directory: apps/backend
        run: dotnet build

      - name: Run the tests
        working-directory: apps/backend
        run: dotnet test
